name: Build Desktop (Reusable)

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
        description: 'Git reference to build (branch, tag, or commit SHA)'
      commit_sha:
        required: false
        type: string
        description: 'Commit SHA for status updates (defaults to github.sha)'
      is_release:
        required: false
        type: boolean
        default: false
        description: 'Whether this is a release build'
      scope:
        required: true
        type: string
        description: >-
          Which build-matrix.json subset to build. 'required' must succeed and
          gates release promotion; 'secondary' may fail without failing the
          release but still ships in the first publish; 'backfill' is the
          genuinely slow leg that publishes after the channel is promoted.
      variant:
        required: false
        type: string
        default: 'all'
        description: >-
          Which channel variant to build: 'production', 'staging', or 'all'.
          Naming one keeps a channel's builds independent of the other's, so a
          slow staging leg cannot hold up a production publish.

env:
  PRIVATE_REPO: Rostoc/rostoc
  UPDATES_DIR: updates
  VERSION_FILE: version.txt

jobs:
  # Load build matrix from centralized config file
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load-matrix.outputs.matrix }}
    steps:
      - name: Checkout for build matrix
        uses: actions/checkout@v4

      - name: Load build matrix configuration
        id: load-matrix
        run: |
          set -euo pipefail
          SCOPE="${{ inputs.scope }}"
          VARIANT="${{ inputs.variant }}"
          CONFIG=.github/config/build-matrix.json

          # A leg's wave defaults to 'primary', so an entry that predates the
          # publish_wave field ships in the first publish rather than silently
          # disappearing from every scope.
          WAVE='(.publish_wave // "primary")'
          case "$SCOPE" in
            required)  FILTER=".is_optional == false and $WAVE == \"primary\"" ;;
            secondary) FILTER=".is_optional == true and $WAVE == \"primary\"" ;;
            backfill)  FILTER="$WAVE == \"backfill\"" ;;
            *)
              echo "::error::Invalid scope '$SCOPE' (expected 'required', 'secondary' or 'backfill')"
              exit 1
              ;;
          esac

          case "$VARIANT" in
            production|staging|all) ;;
            *)
              echo "::error::Invalid variant '$VARIANT' (expected 'production', 'staging' or 'all')"
              exit 1
              ;;
          esac

          # Every leg must be claimed by exactly one scope. Without this a typo
          # in publish_wave would drop a platform from the build silently, and
          # the first sign of it would be a manifest missing that platform.
          TOTAL=$(jq '[.production[], .staging[]] | length' "$CONFIG")
          CLAIMED=$(jq '
            [.production[], .staging[]]
            | map(select(
                (.is_optional == false and (.publish_wave // "primary") == "primary")
                or (.is_optional == true and (.publish_wave // "primary") == "primary")
                or ((.publish_wave // "primary") == "backfill")
              ))
            | length' "$CONFIG")
          if [[ "$TOTAL" != "$CLAIMED" ]]; then
            echo "::error::build-matrix.json has $TOTAL legs but only $CLAIMED are claimed by a scope"
            exit 1
          fi

          PROD_MATRIX=$(jq -c "[.production[] | select($FILTER)]" "$CONFIG")
          STAGING_MATRIX=$(jq -c "[.staging[] | select($FILTER)]" "$CONFIG")

          if [[ "$VARIANT" == "production" ]]; then
            MATRIX="$PROD_MATRIX"
          elif [[ "$VARIANT" == "staging" ]]; then
            MATRIX="$STAGING_MATRIX"
          elif [[ "${{ inputs.is_release }}" == "true" ]]; then
            # Release builds: both production and staging
            MATRIX=$(jq -s -c 'add' <(echo "$PROD_MATRIX") <(echo "$STAGING_MATRIX"))
          else
            # CI builds: production only
            MATRIX="$PROD_MATRIX"
          fi

          COUNT=$(echo "$MATRIX" | jq 'length')
          if [[ "$COUNT" -eq 0 ]]; then
            echo "::error::No build legs matched scope '$SCOPE' variant '$VARIANT'"
            exit 1
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "📦 scope=$SCOPE variant=$VARIANT release=${{ inputs.is_release }}: $COUNT configurations"
          echo "$MATRIX" | jq -r '.[] | "  - \(.name)"'

  build-desktop:
    needs: prepare-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    # Optional jobs continue even if they fail
    continue-on-error: ${{ matrix.is_optional }}

    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_SEND_DEFAULT_PII: ${{ secrets.SENTRY_SEND_DEFAULT_PII }}
      SENTRY_ENVIRONMENT: ${{ inputs.is_release && matrix.variant || 'ci' }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      VITE_SENTRY_SEND_DEFAULT_PII: ${{ secrets.VITE_SENTRY_SEND_DEFAULT_PII }}
      VITE_SENTRY_ENVIRONMENT: ${{ inputs.is_release && matrix.variant || 'ci' }}
      VITE_WEB_APP_URL: https://auth.rostoc.co
      VITE_PRICING_URL: https://rostoc.co/pricing
      ROSTOC_APP_VARIANT: ${{ matrix.variant }}
      ROSTOC_UPDATE_CHANNEL: ${{ matrix.variant == 'staging' && 'staging' || 'stable' }}
      DO_RELEASE_PREFIX: ${{ matrix.variant == 'staging' && 'releases/staging' || 'releases' }}
      # Harden crates.io fetches against intermittent HTTP/2 framing errors.
      CARGO_NET_RETRY: '10'
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_HTTP_TIMEOUT: '120'
      # PostHog analytics (native Tauri plugin reads these at build time)
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
      # PostHog source-map uploads use a personal/CLI API key, not the public project token.
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID || '289366' }}
      POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST }}
      POSTHOG_SOURCEMAP_UPLOAD: ${{ inputs.is_release && '1' || '0' }}
      POSTHOG_BUILD: ${{ github.run_number }}
      # Frontend kill switch for analytics: disable for CI builds, enable for release builds
      VITE_DISABLE_ANALYTICS: ${{ inputs.is_release && '0' || '1' }}
    # macOS Intel release builds spend extra time compressing and signing the full DMG.
    # Linux previously sat at 30, which it grew into rather than exceeded: staging
    # AppImage runs went 27m (08-10) → 28m (08-11) → 29m (08-12) → 30m04s (08-23),
    # failing by four seconds and taking the whole release with it through
    # fail-fast. It now shares the 50 the other platforms get, so a slow runner or
    # another few minutes of build growth costs a slower release, not a dead one.
    timeout-minutes: ${{ inputs.is_release && matrix.platform == 'macos' && matrix.arch == 'x86_64' && 70 || 50 }}
    steps:
      - name: Checkout repo (actions + workflows)
        uses: actions/checkout@v4

      # --- PRE-FLIGHT CHECKS (fail fast) ---
      - name: Pre-flight validation
        shell: bash
        run: |
          echo "🔍 Running pre-flight checks..."

          # Check required secrets are set (without exposing values)
          MISSING_SECRETS=()
          [[ -z "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]] && MISSING_SECRETS+=("APPLE_SIGNING_IDENTITY")
          [[ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]] && MISSING_SECRETS+=("TAURI_SIGNING_PRIVATE_KEY")

          if [[ ${#MISSING_SECRETS[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${MISSING_SECRETS[*]}"
            exit 1
          fi

          # Check disk space upfront. Linux runners can start slightly under
          # the macOS/Windows budget, and Linux is an optional AppImage leg.
          MIN_DISK_GB=20
          WARN_DISK_GB=""
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            MIN_DISK_GB=16
            WARN_DISK_GB=18
          fi

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            AVAILABLE_GB=$(df -g . | tail -1 | awk '{print $4}')
          else
            AVAILABLE_GB=$(df -BG . | tail -1 | awk '{print $4}' | sed 's/G//')
          fi

          if [[ $AVAILABLE_GB -lt $MIN_DISK_GB ]]; then
            echo "::error::Insufficient disk space: ${AVAILABLE_GB}GB available, need ${MIN_DISK_GB}GB minimum"
            exit 1
          fi

          if [[ -n "$WARN_DISK_GB" && $AVAILABLE_GB -lt $WARN_DISK_GB ]]; then
            echo "::warning::Low disk space for optional Linux AppImage build: ${AVAILABLE_GB}GB available, preferred minimum is ${WARN_DISK_GB}GB"
          fi

          # Check workflow inputs
          if [[ "${{ inputs.is_release }}" == "true" && -z "${{ inputs.ref }}" ]]; then
            echo "::error::Release builds require 'ref' input"
            exit 1
          fi

          echo "✅ Pre-flight checks passed"
          echo "   Disk space: ${AVAILABLE_GB}GB available"
          echo "   Secrets: Configured"
          echo "   Build type: ${{ inputs.is_release && 'Release' || 'Development' }}"

          if [[ -n "${SENTRY_AUTH_TOKEN:-}" ]]; then
            echo "✅ Sentry sourcemap upload token is configured"
          else
            echo "::warning::SENTRY_AUTH_TOKEN is not configured; frontend sourcemap upload will be disabled."
          fi

          if [[ "${{ inputs.is_release }}" == "true" ]]; then
            if [[ -n "${POSTHOG_CLI_API_KEY:-}" && -n "${POSTHOG_CLI_PROJECT_ID:-}" ]]; then
              echo "✅ PostHog sourcemap upload credentials are configured"
            else
              echo "::warning::PostHog sourcemap upload is enabled for release builds but POSTHOG_CLI_API_KEY or POSTHOG_CLI_PROJECT_ID is missing."
            fi
          fi

      # --- Phase 1: Prep (checkout, SSH, toolchains) ---
      - uses: ./.github/actions/build-prep
        id: prep
        with:
          ref: ${{ inputs.ref }}
          is_release: ${{ inputs.is_release }}
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          variant: ${{ matrix.variant }}
          private_repo_ssh_key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          apple_certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple_certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_app_specific_password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      # --- Phase 2: Compile (Python, build, stage) ---
      - uses: ./.github/actions/build-compile
        id: compile
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          variant: ${{ matrix.variant }}
          is_release: ${{ inputs.is_release }}
          bundle_target: ${{ !inputs.is_release && matrix.platform == 'macos' && 'app' || 'all' }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple_team_id: ${{ secrets.APPLE_TEAM_ID }}
          apple_id: ${{ secrets.APPLE_ID }}
          apple_app_specific_password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          tauri_signing_private_key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri_signing_private_key_password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Check sourcemap shipping signals
        if: always() && steps.compile.outcome == 'success'
        continue-on-error: true
        shell: bash
        working-directory: private-src
        run: |
          set -euo pipefail
          if [[ ! -f scripts/check_sourcemap_shipping.py ]]; then
            echo "::warning::scripts/check_sourcemap_shipping.py is not present in this source ref; skipping."
            exit 0
          fi
          python3 scripts/check_sourcemap_shipping.py \
            --path dist \
            --path target/release/bundle \
            --path src-tauri/target/release/bundle
          cat .artifacts/sourcemaps/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sourcemap signal summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sourcemap-signals-${{ matrix.variant }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: private-src/.artifacts/sourcemaps
          retention-days: 14
          if-no-files-found: warn

      - name: Append Windows Cargo post-build snapshot
        if: always() && matrix.platform == 'windows' && steps.prep.outputs.metrics_report_path != ''
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/build_metrics.sh append-windows-post-build-row \
            private-src \
            "${{ matrix.variant }}" \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            "$GITHUB_WORKSPACE/.cargo-ci/registry" \
            "$GITHUB_WORKSPACE/.cargo-ci/git"

      - name: Upload build timings report
        if: always() && steps.prep.outputs.metrics_report_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.metrics_report_artifact_name }}
          path: ${{ steps.prep.outputs.metrics_report_path }}
          retention-days: 14
          if-no-files-found: warn

      - name: Append build timings to job summary
        if: always() && steps.prep.outputs.metrics_report_path != ''
        shell: bash
        env:
          REPORT_PATH: ${{ steps.prep.outputs.metrics_report_path }}
        run: |
          set -euo pipefail
          if [[ -f "$REPORT_PATH" ]]; then
            cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "[WARN] Build timings report not found at $REPORT_PATH" >&2
          fi

      # --- Upload build logs IMMEDIATELY (even on failure) ---
      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.variant }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            private-src/build-*.log
            private-src/*.log
            private-src/errors-*.txt
          retention-days: 14
          if-no-files-found: warn

      # --- Phase 3: Sign & Validate (macOS-specific) ---
      - uses: ./.github/actions/build-sign-validate
        id: sign_validate
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          bundle_target: ${{ !inputs.is_release && matrix.platform == 'macos' && 'app' || 'all' }}
          apple_signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      # --- Phase 4: Tests (smoke tests for all platforms) ---
      - uses: ./.github/actions/build-tests
        id: tests
        with:
          variant: ${{ matrix.variant }}
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          app_path: ${{ steps.sign_validate.outputs.app_path }}
          python_path: ${{ steps.sign_validate.outputs.python_path }}

      # --- Phase 5: Artifacts (locate, prepare, upload) ---
      - uses: ./.github/actions/build-artifacts
        id: artifacts
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          is_release: ${{ inputs.is_release }}
          variant: ${{ matrix.variant }}
          version: ${{ steps.prep.outputs.version }}
          updates_repo_token: ${{ secrets.UPDATES_REPO_TOKEN }}
          do_spaces_access_key: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          do_spaces_secret_key: ${{ secrets.DO_SPACES_SECRET_KEY }}
          do_spaces_bucket: ${{ secrets.DO_SPACES_BUCKET }}
          do_spaces_endpoint: ${{ secrets.DO_SPACES_ENDPOINT }}

      - name: Upload Windows MSI for update smoke
        if: ${{ matrix.platform == 'windows' && matrix.arch == 'x86_64' && matrix.variant == 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-for-smoke-${{ github.run_id }}
          path: |
            updates/windows/Rostoc-${{ steps.prep.outputs.version }}-windows-x64.msi
            updates/windows/Rostoc-${{ steps.prep.outputs.version }}-windows-x64.msi.sig
          retention-days: 7
          if-no-files-found: error

      # --- Upload partial artifacts on failure ---
      - name: Upload partial artifacts (if build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: partial-artifacts-${{ matrix.variant }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            private-src/target/release/bundle/**/*
            private-src/src-tauri/target/release/bundle/**/*
            updates/**/*
          retention-days: 7
          if-no-files-found: ignore

      # --- Setup upterm for interactive debugging ---
      - name: Setup upterm session (debug mode)
        if: failure() && contains(github.event.head_commit.message, '[debug]')
        uses: lhotari/action-upterm@v1
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 30

      # --- Upload codesigning logs (macOS failures) ---
      - name: Upload codesign logs (macOS)
        if: failure() && matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: codesign-logs-${{ matrix.variant }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            private-src/codesign-*.log
            private-src/*.codesign
          retention-days: 7
          if-no-files-found: ignore

      # --- Ship logs to Grafana Loki ---
      - name: Send build logs to Loki
        if: always()
        continue-on-error: true
        shell: bash
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
          LOKI_USERNAME: ${{ secrets.LOKI_USERNAME }}
          LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}
        run: |
          LOG_FILE=""
          for candidate in \
            "private-src/build-${{ matrix.platform }}-${{ matrix.arch }}.log" \
            "build-${{ matrix.platform }}-${{ matrix.arch }}.log"; do
            if [[ -f "$candidate" ]]; then
              LOG_FILE="$candidate"
              break
            fi
          done

          if [[ -z "$LOG_FILE" ]]; then
            echo "[WARN] No build log found for Loki shipping"
            exit 0
          fi

          # Prepare labels as JSON for Loki
          LABELS=$(cat <<EOF
          {
            "platform": "${{ matrix.platform }}",
            "arch": "${{ matrix.arch }}",
            "variant": "${{ matrix.variant }}",
            "version": "${{ steps.prep.outputs.version }}",
            "job": "build",
            "status": "${{ job.status }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "actor": "${{ github.actor }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}"
          }
          EOF
          )

          # Use dedicated script for batched, efficient log shipping
          scripts/ci/ship_logs_to_loki.sh "$LOG_FILE" "$LABELS"

      # --- Notify on failure ---
      - name: Notify build failure (Discord)
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_VARIANT: ${{ matrix.variant }}
          BUILD_VERSION: ${{ steps.prep.outputs.version }}
        run: |
          scripts/ci/notify_build_failure_discord.sh
