name: Public Release Build

run-name: >-
  Public release build for ${{ inputs.ref || github.event.client_payload.ref || github.ref_name || 'main' }}
  (${{ github.event_name == 'repository_dispatch' && format('dispatched by {0} from {1}', github.event.client_payload.initiator || github.actor, github.event.client_payload.sourceRepo || 'Rostoc/rostoc') || format('manual by {0}', github.actor) }})

on:
  repository_dispatch:
    types: [public-release-build, trigger-release]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to build, e.g. v0.4.0'
        required: true
      commit_sha:
        description: 'Commit SHA for metadata stamping'
        required: false
      initiator:
        description: 'Triggering user or source context'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

# Release builds serialise and never cancel each other. A cancelled release
# build can leave a channel half-published; a queued one costs only time.
# (Public CI Build cancels in progress, which is right for a CI lane and wrong
# here.)
concurrency:
  group: >-
    public-release-build-${{ inputs.ref || github.event.client_payload.ref || github.ref_name || 'main' }}
  cancel-in-progress: false

jobs:
  # A release is cut from a tag. Nothing else may reach the publish jobs:
  # is_release is true unconditionally below, and both dispatch paths default
  # `ref` to 'main', so without this guard a manual dispatch publishes an
  # untagged commit. Its version comes from package.json, so it lands as
  # another revision of the version already released — and
  # Release._reject_stale_promotion then refuses to promote the real tagged
  # revision, because a higher one supersedes it.
  #
  # A branch build is a CI build. That is what Public CI Build is for.
  guard-release-ref:
    name: Refuse a release build that is not a tag
    runs-on: ubuntu-latest
    steps:
      - name: Check the ref is a release tag
        env:
          RELEASE_REF: >-
            ${{ inputs.ref || github.event.client_payload.ref || github.ref_name || '' }}
        run: |
          set -euo pipefail
          case "${RELEASE_REF}" in
            v[0-9]*)
              echo "Release ref: ${RELEASE_REF}"
              ;;
            "")
              echo "::error::No ref supplied. A release build needs a v* tag."
              exit 1
              ;;
            *)
              echo "::error::Refusing a release build for '${RELEASE_REF}'."
              echo "::error::Releases are cut from a v* tag. For a branch, run Public CI Build."
              exit 1
              ;;
          esac

  run-shared-build:
    needs: guard-release-ref
    uses: ./.github/workflows/build-and-publish.yml
    with:
      ref: ${{ inputs.ref || github.event.client_payload.ref || github.ref_name || 'main' }}
      commit_sha: ${{ inputs.commit_sha || github.event.client_payload.sha || '' }}
      initiator: ${{ inputs.initiator || github.event.client_payload.initiator || github.event.client_payload.sourceRepo || github.actor }}
      is_release: true
    secrets: inherit
